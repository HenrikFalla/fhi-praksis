name: Publiser til Github Pages

on:
  push:
    branches:
      - main

    workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut koden fra repository
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg prosjektet
        run: npm run build

      - name: Konfigurer Github Pages
        uses: actions/configure-pages@v5

      - name: Last opp filer som Pages artifakter
        uses: actions/upload-artifact@v3
        with:
          path: "./github-actions/publish-to-github-pages/dist"

      - name: Publiser til Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
